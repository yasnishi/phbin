[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phbin"
version = "0.1.0"
description = "Utilities for persistent-homology analysis of images and point clouds"
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
authors = [{ name = "Yasutaka Nishida" }]
keywords = ["persistent homology", "topological data analysis", "persistence diagram", "persistence image", "image analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "homcloud",
  "opencv-python",
]
[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/pearcandy/phbin"
Repository = "https://github.com/pearcandy/phbin"
Issues = "https://github.com/pearcandy/phbin/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
